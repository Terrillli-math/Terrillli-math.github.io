project:
  type: website
  output-dir: _site
  resources:
    - fonts/*
  render:
    - index.qmd
    - about.qmd
    - projects.qmd
    - projects/**/*.qmd
    - notes/**/*.qmd

website:
  title: "Terrill Li"
  site-url: https://terrillli-math.github.io
  description: "Mathematics notes and a record of learning."
  search: true
  bread-crumbs: false
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Notes
        href: notes/index.qmd
      - text: About
        href: about.qmd
      - text: Projects
        href: projects.qmd
    right:
      - icon: github
        href: https://github.com/Terrillli-math
        aria-label: GitHub
  page-footer:
    left: "© Terrill Li"
    right: "Built with Quarto"

format:
  html:
    theme:
      dark: darkly
      light: cosmo
    respect-user-color-scheme: false
    css:
      - styles.css
      - reading.css
    grid:
      body-width: 780px
    template-partials:
      - templates/toc.html
    include-after-body: templates/reading-navigation.html
    toc: true
    toc-location: body
    toc-title: Contents
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    link-external-newwindow: true

execute:
  freeze: auto
