project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - projects.qmd
    - projects/**/*.qmd
    - notes/**/*.qmd

website:
  title: "Terrill Li"
  site-url: https://terrillli-math.github.io
  description: "Mathematics notes and a record of learning."
  search: true
  sidebar:
    - id: math1972-seminar
      title: "MATH1972 Seminar Notes"
      style: docked
      collapse-level: 2
      contents:
        - text: "Seminar Overview"
          href: notes/math1972-seminar/index.qmd
        - section: "Game Theory"
          contents:
            - notes/math1972-seminar/nim.qmd
        - section: "Optimisation and Machine Learning"
          contents:
            - notes/math1972-seminar/convexity.qmd
            - notes/math1972-seminar/duality-kkt.qmd
            - notes/math1972-seminar/linear-svm.qmd
            - notes/math1972-seminar/kernels.qmd
        - section: "Network Analysis"
          contents:
            - notes/math1972-seminar/network-analysis.qmd
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Notes
        href: notes/index.qmd
      - text: About
        href: about.qmd
      - text: Projects
        href: projects.qmd
    right:
      - icon: github
        href: https://github.com/Terrillli-math
        aria-label: GitHub
  page-footer:
    left: "© Terrill Li"
    right: "Built with Quarto"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    link-external-newwindow: true

execute:
  freeze: auto
