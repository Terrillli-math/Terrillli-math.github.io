<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" width="640" height="452" role="img" aria-labelledby="title desc">
  <title id="title">One Graph, Four Node Scores</title>
  <desc id="desc">A four-node graph with edges 1-2, 1-3, 2-3, and 3-4. Node scores are 0, 1, 1, and 2. Degrees are 2, 2, 3, and 1. Nodes 1, 2, and 3 form the only triangle.</desc>
  <metadata>n=4; edges=12,13,23,34; x=0,1,1,2; degrees=2,2,3,1; triangles=1</metadata>
