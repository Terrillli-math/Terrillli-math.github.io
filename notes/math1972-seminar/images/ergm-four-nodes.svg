    <text x="320.00" y="72.00" font-size="21" text-anchor="middle" fill="#475569" >4 edges · 1 triangle</text>
    <line x1="135.00" y1="165.00" x2="135.00" y2="330.00" stroke="#2563eb" stroke-width="3.2" class="graph-edge" data-source="1" data-target="2"/>
    <line x1="135.00" y1="165.00" x2="360.00" y2="247.50" stroke="#2563eb" stroke-width="3.2" class="graph-edge" data-source="1" data-target="3"/>
