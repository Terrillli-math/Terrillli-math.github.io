    <text x="60.00" y="172.00" font-size="22" text-anchor="middle" fill="#475569" >x = 0</text>
    <circle cx="135.00" cy="330.00" r="24" fill="#dbeafe" stroke="#1e40af" stroke-width="2.5" data-node="2" data-score="1" data-degree="2"/>
