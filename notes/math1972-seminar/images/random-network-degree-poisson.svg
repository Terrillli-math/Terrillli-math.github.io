<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 552" width="640" height="552" role="img" aria-labelledby="title desc">
  <title id="title">Degrees Near a Poisson Distribution</title>
  <desc id="desc">Probability mass functions for Binomial(24, 3/24), Binomial(99, 3/99), and Poisson(3). All have mean 3. The binomial curves move closer to the Poisson curve as n grows. Only degrees 0 through 12 are shown. Tail probabilities are omitted, not rescaled. Lines join discrete values to help compare them.</desc>
  <metadata>Exact PMFs; n=25,100; p=3/(n-1); Poisson mean=3; k=0..12; no renormalization</metadata>
