<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 603" width="640" height="603" role="img" aria-labelledby="title desc">
  <title id="title">Checking Triangles under G(4, 2/3)</title>
  <desc id="desc">The exact triangle-count distribution in G(4, 2/3). P(T=0)=83/243. P(T=1)=224/729. P(T=2)=64/243. P(T=3)=0. P(T=4)=64/729. The observed four-node graph has one triangle; that count is highlighted. This is an exact distribution, not a simulation or a probability that the model is true.</desc>
  <metadata>n=4; p=2/3; all 64 labelled graphs enumerated; exact rational masses; observed m=4 and t=1; no parameter-uncertainty adjustment</metadata>
