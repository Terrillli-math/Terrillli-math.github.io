<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" role="img" aria-labelledby="title desc">
  <title id="title">An Added Isolated Node</title>
  <desc id="desc">An author-created graph with two connected components. Nodes 1 to 7 form a triangle joined to a four-cycle. Node 8 has no edges and forms a separate component.</desc>
  <rect width="700" height="460" rx="16" fill="#f8fafc"/>
  <rect x="38" y="35" width="624" height="290" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="7 6"/>
  <g fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 90L90 270L245 180Z"/>
    <path d="M245 180L410 180"/>
    <path d="M410 180L520 90L630 180L520 270Z"/>
  </g>
  <g fill="#dbeafe" stroke="#1e40af" stroke-width="2.5">
    <circle cx="90" cy="90" r="24"/><circle cx="90" cy="270" r="24"/>
    <circle cx="245" cy="180" r="24"/><circle cx="410" cy="180" r="24"/>
    <circle cx="520" cy="90" r="24"/><circle cx="630" cy="180" r="24"/><circle cx="520" cy="270" r="24"/>
  </g>
  <circle cx="350" cy="382" r="25" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/>
  <g font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#172554">
    <text x="90" y="90">1</text><text x="90" y="270">2</text>
    <text x="245" y="180">3</text><text x="410" y="180">4</text>
    <text x="520" y="90">5</text><text x="630" y="180">6</text><text x="520" y="270">7</text>
    <text x="350" y="382" fill="#9a3412">8</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#475569">
    <text x="350" y="60">Component 1</text>
    <text x="350" y="432">Component 2: Isolated Node</text>
  </g>
</svg>
