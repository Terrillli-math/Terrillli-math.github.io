<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 548" width="640" height="548" role="img" aria-labelledby="title desc">
  <title id="title">Expected Number of Isolated Nodes</title>
  <desc id="desc">The exact expected count n(1-p)^(n-1), with p=c log(n)/n, for n=60, 600, and 6000. The horizontal axis runs from c=0.5 to c=1.5. The vertical axis is logarithmic. Reference lines mark c=1 and expected count 1. Curves get steeper as n grows. All three values near c=1 are close to, but not exactly, 1. These are expectations, not probabilities.</desc>
  <metadata>E[X]=n(1-c log(n)/n)^(n-1); natural log; n=60,600,6000; c=0.5..1.5; 201 points; log10 vertical scale</metadata>
