<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Neighbors of Node 3</title>
  <desc id="desc">An author-created graph. Node 3 is purple. Its neighbors 1, 2, and 4 are blue. Only neighbors 1 and 2 share an edge, shown in orange. The local clustering coefficient of node 3 is one third.</desc>
  <rect width="700" height="400" rx="16" fill="#f8fafc"/>
  <g fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 90L245 180L90 270"/>
    <path d="M245 180L410 180"/>
    <path d="M410 180L520 90L630 180L520 270Z"/>
    <path d="M90 90L90 270" stroke="#c2410c" stroke-width="5"/>
  </g>
  <g fill="#e2e8f0" stroke="#64748b" stroke-width="2.5">
    <circle cx="520" cy="90" r="24"/><circle cx="630" cy="180" r="24"/><circle cx="520" cy="270" r="24"/>
  </g>
  <g fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5">
    <circle cx="90" cy="90" r="24"/><circle cx="90" cy="270" r="24"/><circle cx="410" cy="180" r="24"/>
  </g>
  <circle cx="245" cy="180" r="26" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#172554">
    <text x="90" y="90">1</text><text x="90" y="270">2</text>
    <text x="245" y="180" fill="#5b21b6">3</text><text x="410" y="180">4</text>
    <text x="520" y="90">5</text><text x="630" y="180">6</text><text x="520" y="270">7</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <text x="350" y="330" fill="#5b21b6">Node 3 Has Three Neighbors</text>
    <text x="350" y="354" fill="#9a3412">One of Three Neighbor Pairs Is Linked</text>
    <text x="350" y="380" font-size="14" fill="#475569">Author-Created Example</text>
  </g>
</svg>
