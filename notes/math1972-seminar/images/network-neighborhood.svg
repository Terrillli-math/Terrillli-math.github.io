<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="620" height="420" role="img" aria-labelledby="title desc">
  <title id="title">The Neighborhood of Node 1</title>
  <desc id="desc">Node 1 is purple. Its three neighbors, 4, 5, and 6, are blue. The orange edge between nodes 5 and 6 is the only edge among those neighbors.</desc>
  <rect width="620" height="420" rx="14" fill="#f8fafc"/>
  <g stroke="#cbd5e1" stroke-width="3.5" fill="none">
    <path d="M340 345L485 220 M340 345L125 275 M485 220L420 60 M485 220L270 190"/>
  </g>
  <g stroke="#2563eb" stroke-width="4" fill="none">
    <path d="M160 85L420 60 M160 85L125 275 M160 85L270 190"/>
  </g>
  <path d="M125 275L270 190" stroke="#c2410c" stroke-width="5" fill="none"/>
  <g fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5">
    <circle cx="420" cy="60" r="25"/><circle cx="125" cy="275" r="25"/><circle cx="270" cy="190" r="25"/>
  </g>
  <g fill="#e2e8f0" stroke="#64748b" stroke-width="2.5">
    <circle cx="340" cy="345" r="25"/><circle cx="485" cy="220" r="25"/>
  </g>
  <circle cx="160" cy="85" r="25" fill="#7c3aed" stroke="#5b21b6" stroke-width="2.5"/>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#172554">
    <text x="160" y="85" fill="#ffffff">1</text><text x="340" y="345">2</text>
    <text x="485" y="220">3</text><text x="420" y="60">4</text>
    <text x="125" y="275">5</text><text x="270" y="190">6</text>
  </g>
</svg>
