<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 710" width="640" height="710" role="img" aria-labelledby="title desc">
  <title id="title">One Edge, Two Conditions</title>
  <desc id="desc">Two three-node networks for an edge-triangle ERGM. The candidate edge 1-3 is dashed. When all other edges are absent, its conditional probability is 1/3. When edges 1-2 and 2-3 are present, adding 1-3 closes a triangle, so its conditional probability is 2/3. The coefficients are the same in both panels.</desc>
  <metadata>n=3; theta_edges=-log(2); theta_triangles=log(4); conditional p13=1/3 when a12=a23=0, 2/3 when a12=a23=1</metadata>
  <rect width="640" height="710" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="320.00" y="38.00" font-size="26" text-anchor="middle" fill="#0f172a" font-weight="600">One Edge, Two Conditions</text>
    <text x="320.00" y="71.00" font-size="20" text-anchor="middle" fill="#475569" >Edge term = -log(2); triangle term = log(4)</text>
    <rect x="24" y="95" width="592" height="260" rx="12" fill="#eff6ff" stroke="#cbd5e1"/>
    <text x="320.00" y="127.00" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="600">No Shared Neighbour</text>
    <line x1="170.00" y1="250.00" x2="470.00" y2="250.00" stroke="#b45309" stroke-width="3.5" stroke-dasharray="10 7" class="candidate-edge" data-panel="0" data-source="1" data-target="3" data-probability="1/3"/>
    <circle cx="170.00" cy="250.00" r="24" fill="#dbeafe" stroke="#1e40af" stroke-width="2.5" />
    <text x="170.00" y="251.00" font-size="24" text-anchor="middle" fill="#172554" dominant-baseline="central" font-weight="600">1</text>
    <circle cx="320.00" cy="175.00" r="24" fill="#dbeafe" stroke="#1e40af" stroke-width="2.5" />
    <text x="320.00" y="176.00" font-size="24" text-anchor="middle" fill="#172554" dominant-baseline="central" font-weight="600">2</text>
    <circle cx="470.00" cy="250.00" r="24" fill="#dbeafe" stroke="#1e40af" stroke-width="2.5" />
    <text x="470.00" y="251.00" font-size="24" text-anchor="middle" fill="#172554" dominant-baseline="central" font-weight="600">3</text>
    <text x="320.00" y="326.00" font-size="24" text-anchor="middle" fill="#b45309" >P(edge 1-3 | rest) = 1/3</text>
    <rect x="24" y="375" width="592" height="260" rx="12" fill="#eff6ff" stroke="#cbd5e1"/>
    <text x="320.00" y="407.00" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="600">One Shared Neighbour</text>
    <line x1="170.00" y1="530.00" x2="320.00" y2="455.00" stroke="#2563eb" stroke-width="3.5" class="fixed-edge" data-panel="1" data-source="1" data-target="2"/>
    <line x1="320.00" y1="455.00" x2="470.00" y2="530.00" stroke="#2563eb" stroke-width="3.5" class="fixed-edge" data-panel="1" data-source="2" data-target="3"/>
    <line x1="170.00" y1="530.00" x2="470.00" y2="530.00" stroke="#b45309" stroke-width="3.5" stroke-dasharray="10 7" class="candidate-edge" data-panel="1" data-source="1" data-target="3" data-probability="2/3"/>
    <circle cx="170.00" cy="530.00" r="24" fill="#dbeafe" stroke="#1e40af" stroke-width="2.5" />
    <text x="170.00" y="531.00" font-size="24" text-anchor="middle" fill="#172554" dominant-baseline="central" font-weight="600">1</text>
    <circle cx="320.00" cy="455.00" r="24" fill="#dbeafe" stroke="#1e40af" stroke-width="2.5" />
    <text x="320.00" y="456.00" font-size="24" text-anchor="middle" fill="#172554" dominant-baseline="central" font-weight="600">2</text>
    <circle cx="470.00" cy="530.00" r="24" fill="#dbeafe" stroke="#1e40af" stroke-width="2.5" />
    <text x="470.00" y="531.00" font-size="24" text-anchor="middle" fill="#172554" dominant-baseline="central" font-weight="600">3</text>
    <text x="320.00" y="606.00" font-size="24" text-anchor="middle" fill="#b45309" >P(edge 1-3 | rest) = 2/3</text>
    <line x1="100.00" y1="670.00" x2="150.00" y2="670.00" stroke="#b45309" stroke-width="3.5" stroke-dasharray="10 7"/>
    <text x="165.00" y="677.00" font-size="20" text-anchor="start" fill="#475569" >Candidate edge; all other edges are fixed</text>
  </g>
</svg>
